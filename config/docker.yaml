database:
  host: "postgres"
  port: 5432
  name: "archiva"
  user: "archiva"
  password: "archiva"

app:
  host: "0.0.0.0"
  port: 8000
  debug: false
  md5_duplicate_check: true

storage:
  base_path: "/app/data/documents"

search:
  max_results: 100
  highlight_fragment_size: 150
  engine: "opensearch"
  opensearch_url: "http://opensearch:9200"
  index_name: "archiva-documents-v1"

pdf_stampede:
  enabled: false
  base_url: "http://pdfstampede:8001"
  default_template_id: ""
  timeout_seconds: 30
  store_mode: "artifact"
